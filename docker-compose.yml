x-app-env: &app-env
  NODE_ENV: production
  SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en el archivo .env}
  REDIS_URL: redis://redis:6379
  FRONTAL_PORT: 3000
  NODE_1_URL: http://node1:3001
  NODE_2_URL: http://node2:3002
  NODE_3_URL: http://node3:3003

services:
  # ==================================
  # REDIS
  # ==================================
  redis:
    image: redis:7-alpine
    container_name: proyecto_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================================
  # NODO 1
  # ==================================
  node1:
    build: .
    container_name: proyecto_node1
    restart: unless-stopped
    command: ["node", "server/index.js"]
    environment:
      <<: *app-env
      PORT: 3001
      NODE_NAME: Nodo-1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ==================================
  # NODO 2
  # ==================================
  node2:
    build: .
    container_name: proyecto_node2
    restart: unless-stopped
    command: ["node", "server/index.js"]
    environment:
      <<: *app-env
      PORT: 3002
      NODE_NAME: Nodo-2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ==================================
  # NODO 3
  # ==================================
  node3:
    build: .
    container_name: proyecto_node3
    restart: unless-stopped
    command: ["node", "server/index.js"]
    environment:
      <<: *app-env
      PORT: 3003
      NODE_NAME: Nodo-3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ==================================
  # PROXY NODE.JS
  # ==================================
  proxy:
    build: .
    container_name: proyecto_proxy
    restart: unless-stopped
    command: ["node", "server/proxy.js"]
    environment:
      <<: *app-env
    depends_on:
      - node1
      - node2
      - node3
    networks:
      - app_network

  # ==================================
  # NGINX
  # ==================================
  nginx:
    image: nginx:alpine
    container_name: proyecto_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - proxy
    networks:
      - app_network

# ==================================
# VOLUMENES
# ==================================
volumes:
  redis_data:

# ==================================
# RED DOCKER
# ==================================
networks:
  app_network:
    driver: bridge
