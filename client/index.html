<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demostración de Cluster PWA</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      body {
        background-color: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.1),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        text-align: center;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .title {
        font-size: 1.25rem;
        font-weight: 700;
        color: #111827;
      }
      .badge {
        background-color: #e0e7ff;
        color: #4338ca;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 9999px;
      }
      .session-box {
        background-color: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 24px;
      }
      .session-label {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #6b7280;
        margin-bottom: 6px;
      }
      .session-id {
        font-size: 1.75rem;
        font-weight: 800;
        color: #4f46e5;
        letter-spacing: 1px;
      }
      .info-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 24px;
        font-size: 0.875rem;
      }
      .info-item {
        display: flex;
        justify-content: space-between;
        color: #4b5563;
      }
      .info-value {
        font-weight: 600;
        color: #111827;
      }
      .btn {
        width: 100%;
        background-color: #4f46e5;
        color: white;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition:
          background-color 0.2s,
          transform 0.1s;
      }
      .btn:hover {
        background-color: #4338ca;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-secundario {
        background-color: #6b7280;
        margin-top: 10px;
      }
      .btn-secundario:hover {
        background-color: #4b5563;
      }
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .login-form input {
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        font-size: 0.95rem;
      }
      .error {
        color: #dc2626;
        font-size: 0.85rem;
        min-height: 1.2em;
        margin-top: 8px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h1 class="title">Panel de Control PWA</h1>
        <span class="badge" id="node-badge">Conectando...</span>
      </div>

      <div id="vista-login">
        <form class="login-form" id="login-form">
          <input type="text" id="usuario" placeholder="Usuario" required />
          <input type="password" id="clave" placeholder="Contraseña" required />
          <button class="btn" type="submit">Iniciar sesión</button>
        </form>
        <div class="error" id="error-login"></div>
      </div>

      <div id="vista-panel" class="hidden">
        <div class="session-box">
          <div class="session-label">ID Sesión Compartida</div>
          <div class="session-id" id="session-id">------</div>
        </div>

        <div class="info-list">
          <div class="info-item">
            <span>Usuario autenticado</span>
            <span class="info-value" id="usuario-info">--</span>
          </div>
          <div class="info-item">
            <span>Peticiones registradas</span>
            <span class="info-value" id="visit-count">0 visitas</span>
          </div>
          <div class="info-item">
            <span>Puerto Activo</span>
            <span class="info-value" id="port-info">:----</span>
          </div>
          <div class="info-item">
            <span>Entorno / Respuesta</span>
            <span class="info-value" id="env-info">-- (--ms)</span>
          </div>
        </div>

        <button class="btn" id="fetch-btn">Probar Siguiente Nodo</button>
        <button class="btn btn-secundario" id="logout-btn">
          Cerrar sesión
        </button>
      </div>
    </div>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").then((reg) => {
          reg.update();
        });
      }

      const vistaLogin = document.getElementById("vista-login");
      const vistaPanel = document.getElementById("vista-panel");

      function mostrar(autenticado) {
        vistaLogin.classList.toggle("hidden", autenticado);
        vistaPanel.classList.toggle("hidden", !autenticado);
      }

      async function probarNodo() {
        const inicio = performance.now();
        try {
          const res = await fetch("/api/info", {
            credentials: "same-origin",
            headers: { Accept: "application/json" },
          });
          const data = await res.json();
          const ms = Math.round(performance.now() - inicio);

          document.getElementById("node-badge").textContent = data.nodo;
          document.getElementById("session-id").textContent = data.sessionId;
          document.getElementById("usuario-info").textContent =
            data.usuario || "--";
          document.getElementById("visit-count").textContent =
            `${data.visitas} visitas`;
          document.getElementById("port-info").textContent = `:${data.puerto}`;
          document.getElementById("env-info").textContent =
            `${data.env} (${ms}ms)`;

          mostrar(Boolean(data.usuario));
        } catch (err) {
          console.error("Error obteniendo respuesta del nodo:", err);
          document.getElementById("node-badge").textContent = "Error";
        }
      }

      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errorBox = document.getElementById("error-login");
          errorBox.textContent = "";

          const res = await fetch("/api/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              usuario: document.getElementById("usuario").value,
              clave: document.getElementById("clave").value,
            }),
          });

          if (res.ok) {
            probarNodo();
          } else {
            const data = await res.json();
            errorBox.textContent = data.mensaje;
          }
        });

      document
        .getElementById("logout-btn")
        .addEventListener("click", async () => {
          await fetch("/api/logout", {
            method: "POST",
            credentials: "same-origin",
          });
          probarNodo();
        });

      document
        .getElementById("fetch-btn")
        .addEventListener("click", probarNodo);

      probarNodo();
    </script>
  </body>
</html>
